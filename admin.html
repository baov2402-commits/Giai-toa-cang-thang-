<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lí – Vườn Bình Yên</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* Vườn Bình Yên – giao diện "hacker xanh" */
:root{--bg:#020a06;--card:#04140cdd;--t:#c8ffd9;--m:#5fae80;--g:#00ff88;--g2:#00ff8822;--gd:#00b862;--l:#0f3d26;--cy:#3df0ff;--lime:#b6ff3d;--tl:#2bd9a8;--mint:#7dffc4;
--glow:0 0 8px #00ff8866,0 0 22px #00ff8822;--mono:"JetBrains Mono","Cascadia Mono","Courier New","Noto Sans Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:500 16px/1.5 var(--mono);color:var(--t);background:radial-gradient(ellipse at top,#062a17 0%,var(--bg) 65%);min-height:100vh;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000022 2px 3px)}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35}
.w{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--l);border-radius:10px;box-shadow:var(--glow),inset 0 0 40px #00ff880a;padding:20px;margin-bottom:14px;backdrop-filter:blur(3px);position:relative}
.card::before{content:"● ● ●";position:absolute;top:6px;left:12px;font-size:9px;letter-spacing:3px;color:#1d6b43}
h1{font-size:38px;line-height:1.1;margin:8px 0 6px;color:var(--g);font-weight:800;text-shadow:0 0 12px #00ff88aa;letter-spacing:1px}
h1::after{content:"_";animation:blink 1s steps(1) infinite}
h2{font-size:22px;margin:6px 0 10px;font-weight:800;color:var(--g);text-shadow:0 0 8px #00ff8877}
h2::before{content:"> ";color:var(--m)}
@keyframes blink{50%{opacity:0}}
p{margin:6px 0}.m{color:var(--m)}.c{text-align:center}.small{font-size:13px}.err{color:#ff7b9c;min-height:1.2em;margin:8px 0 0}
.cmt{color:var(--m);font-size:13px}.cmt::before{content:"// "}
.btn{display:block;width:100%;border:1px solid var(--g);border-radius:8px;padding:13px 16px;font:700 17px var(--mono);cursor:pointer;color:#001a0c;background:var(--g);
box-shadow:0 0 14px #00ff8866;margin-top:10px;transition:transform .08s,box-shadow .2s;text-transform:none}
.btn:hover{box-shadow:0 0 24px #00ff88aa}
.btn:active{transform:translateY(2px)}
.btn.s{background:transparent;color:var(--g);box-shadow:none}
.btn.s:hover{background:var(--g2)}
.btn.s.on{background:var(--g2);box-shadow:inset 0 0 0 1px var(--g),0 0 12px #00ff8855}
.btn.p{background:var(--cy);border-color:var(--cy);box-shadow:0 0 14px #3df0ff66}
.btn.o{background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px #b6ff3d66}
.btn.r{background:transparent;color:#ff7b9c;border-color:#ff7b9c;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--l);font:600 18px var(--mono);color:var(--g);background:#010805;caret-color:var(--g)}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 12px #00ff8855}
input::placeholder{color:#2c6b4a}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.av button,.mood button{font-size:30px;border:1px solid var(--l);background:#010805;border-radius:8px;padding:6px 0;cursor:pointer}
.av button.on,.mood button.on{border-color:var(--g);background:var(--g2);box-shadow:0 0 12px #00ff8866}
.mood{display:flex;gap:8px;margin:8px 0}.mood button{flex:1}
.lbl{font-weight:700;margin-top:16px;color:var(--cy)}
.lbl::before{content:"$ ";color:var(--m)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--l);border-radius:10px;padding:8px 12px;box-shadow:var(--glow);margin-bottom:12px}
.top .me{font-size:28px}.top .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g)}
.pill{border:1px solid var(--lime);color:var(--lime);border-radius:6px;padding:2px 10px;font-weight:800;white-space:nowrap;font-size:14px}
.pill.tm{border-color:var(--cy);color:var(--cy)}
.ic{border:1px solid var(--l);background:#010805;border-radius:6px;font-size:18px;padding:3px 7px;cursor:pointer}
.ic:hover{border-color:var(--g)}
.garden{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2px;font-size:22px;min-height:38px;padding:6px 10px;border-radius:8px;border:1px dashed #1d6b43;background:linear-gradient(#00ff8808,#00ff8818);margin-bottom:12px;align-items:flex-end}
.garden span{animation:pop .5s ease;filter:drop-shadow(0 0 4px #00ff8866)}
.garden .e{color:var(--m);font-size:13px;filter:none}
@keyframes pop{0%{transform:scale(0) translateY(10px)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.tag{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:4px;padding:1px 10px;font-weight:700;font-size:13px;background:var(--g2)}
.q{font-size:21px;font-weight:700;margin:12px 0 4px;color:#eafff1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ans button{position:relative;border:1px solid;border-radius:8px;padding:16px 14px 16px 44px;min-height:84px;font:700 16px/1.3 var(--mono);cursor:pointer;text-align:left;background:#010805;transition:transform .08s,background .15s}
.ans button::before{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.9}
.ans .b0{color:var(--g);border-color:var(--g)}.ans .b0::before{content:"[A]"}
.ans .b1{color:var(--cy);border-color:var(--cy)}.ans .b1::before{content:"[B]"}
.ans .b2{color:var(--lime);border-color:var(--lime)}.ans .b2::before{content:"[C]"}
.ans .b3{color:var(--mint);border-color:var(--mint)}.ans .b3::before{content:"[D]"}
.ans button:hover{background:#00ff8814;box-shadow:0 0 14px currentColor}
.ans button:active{transform:translateY(2px)}
.ans button.dim{opacity:.25}.ans button.ok{background:#00ff8826;box-shadow:0 0 18px currentColor}
@media(max-width:560px){.ans{grid-template-columns:1fr}.ans button{min-height:58px}h1{font-size:30px}}
.boxes{display:flex;gap:12px;margin-top:12px}
.boxes button{flex:1;border:1px solid var(--g);background:#010805;border-radius:8px;padding:14px 6px;cursor:pointer;font:700 14px var(--mono);color:var(--g)}
.boxes button:hover{box-shadow:0 0 18px #00ff8888;background:var(--g2)}
.boxes button .e{font-size:46px;display:block;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #00ff8899)}
.boxes button:nth-child(2) .e{animation-delay:.3s}.boxes button:nth-child(3) .e{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.reveal{font-size:66px;animation:pop .6s ease;filter:drop-shadow(0 0 12px #00ff88)}
.msg{border-left:3px solid #ffb86b;background:#ffb86b12;border-radius:4px;padding:10px 14px;margin-top:12px}
.msg.ok{border-color:var(--g);background:var(--g2)}
.breath{width:190px;height:190px;margin:22px auto;border-radius:50%;border:2px solid var(--g);background:radial-gradient(circle,#00ff8833,#00ff8808 70%);display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:19px;color:var(--g);transform:scale(.6);transition:transform 4s ease-in-out;box-shadow:0 0 30px #00ff8855,inset 0 0 30px #00ff8833;text-shadow:0 0 8px #00ff88}
.lb{list-style:none;padding:0;margin:8px 0}
.lb li{display:flex;align-items:center;gap:10px;border:1px solid var(--l);background:#010805;border-radius:6px;padding:7px 12px;margin:6px 0}
.lb .r{font-weight:800;width:30px;color:var(--m)}.lb .a{font-size:24px}.lb .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .s{font-weight:800;color:var(--lime)}.lb li.me{border-color:var(--g);background:var(--g2)}
.lb .off{opacity:.45}
.lb .x{border:1px solid #ff7b9c55;color:#ff7b9c;background:none;border-radius:4px;cursor:pointer;font:600 12px var(--mono);padding:2px 6px}
.code{font-size:72px;font-weight:800;letter-spacing:14px;color:var(--g);text-align:center;line-height:1.1;text-shadow:0 0 20px #00ff88,0 0 40px #00ff8866}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;border:1px solid var(--l);background:#010805;border-radius:8px;padding:10px;text-align:center;font-size:13px;color:var(--m)}
.stat b{display:block;font-size:24px;color:var(--g);text-shadow:0 0 8px #00ff8877}
.hide{display:none!important}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:36px;font-weight:800;color:var(--lime);text-shadow:0 0 14px var(--lime);pointer-events:none;animation:up 1.2s ease forwards;z-index:60}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.leaf{position:fixed;top:-40px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:2;opacity:.6}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
details summary{cursor:pointer;color:var(--cy)}
.term{font-size:13px;color:var(--m);text-align:left;margin:10px 0 0;min-height:4.6em;white-space:pre-wrap}
.term b{color:var(--g)}
a{color:var(--cy)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chk label{border:1px solid var(--l);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;background:#010805}
.chk label.on{border-color:var(--g);color:var(--g);background:var(--g2)}
.chk input{display:none}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
<style>.w{max-width:1100px}.log{height:150px;overflow:auto;font-size:12px;color:var(--m);background:#010805;border:1px solid var(--l);border-radius:6px;padding:8px;white-space:pre-wrap}
.qlist{max-height:340px;overflow:auto;font-size:13px}.qlist div{border-bottom:1px dashed var(--l);padding:6px 0}.qlist i{color:var(--g);font-style:normal}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1}.bar .who{flex:1;color:var(--m);font-size:14px}.bar .who b{color:var(--g)}
.bar button{width:auto;margin:0;padding:6px 12px;font-size:13px}
.hist{list-style:none;padding:0;margin:0}.hist>li{border:1px solid var(--l);background:#010805;border-radius:6px;margin:8px 0}
.hist summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none;color:var(--t)}.hist summary::-webkit-details-marker{display:none}
.hist summary .d{flex:1}.hist summary .d small{display:block;color:var(--m)}.hist .body{padding:0 12px 10px}
.hist table{width:100%;border-collapse:collapse;font-size:13px}.hist td,.hist th{padding:4px 6px;border-bottom:1px dashed var(--l);text-align:left}.hist th{color:var(--m);font-weight:500}
.rooms li{cursor:pointer}</style>
</head>

<div class="w" id="app"></div>
<script>
// Mưa ký tự code kiểu "hacker" – rơi chậm, dịu mắt. Ký tự lấy từ công thức Vật lí 7.
(function(){
  const cv=document.createElement("canvas");cv.id="rain";document.body.prepend(cv);
  const ctx=cv.getContext("2d");
  const TOK="v=s/t 01 Hz dB N S i=i' km/h m/s 3,6 1/15 20000 λ ∆ Φ B ⚡ ☀ { } < > / = + 0 1 0 1 ア イ ウ エ".split(" ").join("").split("");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,cols,drops,fs=16;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/fs);drops=Array.from({length:cols},()=>Math.random()*-H/fs)}
  addEventListener("resize",rs);rs();
  let last=0;
  function draw(t){requestAnimationFrame(draw);if(t-last<70)return;last=t;
    ctx.fillStyle="rgba(2,10,6,0.12)";ctx.fillRect(0,0,W,H);
    ctx.font=fs+"px JetBrains Mono, monospace";
    for(let i=0;i<cols;i++){
      const ch=TOK[Math.random()*TOK.length|0],y=drops[i]*fs;
      ctx.fillStyle=Math.random()<.04?"#d8ffe6":(i%3?"#00ff88":"#3df0ff");
      ctx.fillText(ch,i*fs,y);
      if(y>H&&Math.random()>.975)drops[i]=0;
      drops[i]+=.55;
    }
  }
  if(!reduce)requestAnimationFrame(draw);
  // Gõ chữ kiểu terminal: typeLines(el, ["dòng 1","dòng 2"])
  window.typeLines=function(el,lines,speed=18){if(!el)return;el.textContent="";let i=0,j=0;
    (function step(){if(!el.isConnected||i>=lines.length)return;if(j<=lines[i].length){el.textContent=lines.slice(0,i).join("\n")+(i?"\n":"")+lines[i].slice(0,j)+"▌";j++;setTimeout(step,speed)}
    else{i++;j=0;setTimeout(step,180)}})()};
})();
</script>

// Muốn thêm câu: thêm một dòng cùng dạng vào mảng Q.
window.Q=[

[8,"1 m/s bằng bao nhiêu km/h?",["3,6 km/h","36 km/h","1000 km/h","0,36 km/h"],0,"1 m/s = 3600 m/h = 3,6 km/h."],
[8,"Bạn An đi bộ 600 m trong 300 s. Tốc độ của An là:",["2 m/s","3 m/s","0,5 m/s","180 m/s"],0,"v = s/t = 600/300 = 2 m/s."],
[9,"Trong phòng thí nghiệm, dụng cụ đo thời gian chính xác để đo tốc độ là:",["Cổng quang điện nối đồng hồ hiện số","Nhiệt kế","Lực kế","Cân đồng hồ"],0,"Cổng quang điện bật/tắt đồng hồ hiện số khi vật đi qua nên đo thời gian rất chính xác."],
[9,"Muốn đo tốc độ của một vật, ta cần đo:",["Quãng đường và thời gian","Khối lượng và thời gian","Nhiệt độ và quãng đường","Lực và khối lượng"],0,"Đo s và t rồi tính v = s/t."],
[9,"Thiết bị \"bắn tốc độ\" của cảnh sát giao thông dùng để:",["Đo tốc độ của xe","Đo khối lượng xe","Đo độ ồn của xe","Đo nhiệt độ động cơ"],0,"Thiết bị bắn tốc độ đo tốc độ xe để kiểm tra việc chấp hành tốc độ quy định."],

[10,"Đồ thị s–t của vật chuyển động đều có dạng:",["Đường thẳng xiên lên","Đường tròn","Đường nằm ngang","Đường gấp khúc đi xuống"],0,"Chuyển động đều: s tăng đều theo t → đường thẳng xiên lên."],
[11,"Quãng đường dừng xe gồm:",["Quãng đường phản ứng + quãng đường phanh","Chỉ quãng đường phanh","Chỉ quãng đường phản ứng","Chiều dài của xe"],0,"Người lái cần thời gian phản ứng rồi mới phanh, nên quãng đường dừng = phản ứng + phanh."],
[11,"Khi tốc độ xe tăng thì quãng đường dừng xe:",["Dài hơn","Ngắn hơn","Không đổi","Bằng 0"],0,"Tốc độ càng lớn, xe càng khó dừng → quãng đường dừng càng dài, tai nạn càng nghiêm trọng."],
[11,"Trên đường ướt, trơn, quãng đường phanh sẽ:",["Dài hơn đường khô","Ngắn hơn đường khô","Bằng đường khô","Không phanh được"],0,"Đường trơn làm phanh kém hiệu quả → quãng đường phanh dài hơn. Hãy giữ khoảng cách an toàn nhé!"],
[12,"Âm thanh KHÔNG truyền được trong môi trường nào?",["Chân không","Nước","Không khí","Thép"],0,"Âm cần các phân tử để truyền dao động; chân không không có phân tử nên âm không truyền được."],
[12,"Âm truyền nhanh nhất trong:",["Thép","Nước","Không khí","Chân không"],0,"Tốc độ truyền âm: rắn > lỏng > khí. Trong thép khoảng 6100 m/s."],
[12,"Các nguồn âm đều có chung đặc điểm:",["Đều dao động","Đều nóng lên","Đều phát sáng","Đều đứng yên"],0,"Âm thanh do các vật dao động phát ra."],
[13,"Đơn vị của tần số là:",["Hertz (Hz)","Đêxiben (dB)","Mét (m)","Giây (s)"],0,"Tần số đo bằng hertz (Hz): số dao động trong 1 giây."],
[13,"Biên độ dao động càng lớn thì âm phát ra:",["Càng to","Càng nhỏ","Càng cao","Càng trầm"],0,"Biên độ quyết định độ to; tần số quyết định độ cao."],
[13,"Tai người bình thường nghe được âm có tần số:",["Từ 20 Hz đến 20 000 Hz","Dưới 20 Hz","Trên 20 000 Hz","Từ 0 đến 20 Hz"],0,"Dưới 20 Hz là hạ âm, trên 20 000 Hz là siêu âm — tai người không nghe được."],
[14,"Ta nghe được tiếng vang khi âm phản xạ đến tai chậm hơn âm trực tiếp ít nhất:",["1/15 giây","1 giây","1/2 giây","1/100 giây"],0,"Âm phản xạ đến sau ít nhất 1/15 s thì tai phân biệt được → nghe tiếng vang."],
[14,"Vật nào phản xạ âm tốt nhất?",["Tường gạch cứng, nhẵn","Rèm vải dày","Tấm xốp","Thảm len"],0,"Vật cứng, nhẵn phản xạ âm tốt; vật mềm, xốp hấp thụ âm tốt."],

<div class="term" id="term"></div>
<form id="f"><div class="lbl">Email</div><input type="text" id="em" inputmode="email" placeholder="ten@truong.edu.vn" autocomplete="username">
<div class="lbl">Mật khẩu</div><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
<p class="err" id="er">${esc(msg)}</p><button class="btn" id="go" type="submit">Đăng nhập →</button></form>
<a class="btn s" href="/dang-ki" style="text-align:center;text-decoration:none">+ Tạo tài khoản giáo viên</a>
<p class="m small c">Học sinh vào trang chính: <b id="org"></b></p></div>`;
$("#org").textContent=location.origin;
typeLines($("#term"),["> xác thực quyền truy cập...","> đăng nhập bằng tài khoản giáo viên"]);
$("#f").onsubmit=async e=>{e.preventDefault();$("#go").disabled=true;$("#er").textContent="";
try{const j=await post("/api/auth/login",{email:$("#em").value.trim(),password:$("#pw").value});AUTH={auth:j.auth,name:j.name};ls("vby-auth",AUTH);dashboard()}
catch(x){$("#er").textContent=x.message;$("#go").disabled=false}};
$("#em").focus()}

// ---------- Bảng điều khiển ----------
async function dashboard(){
app.innerHTML=bar()+`<div class="grid2"><div>
<div class="card c"><div class="cmt">xin chào</div><h2 style="display:inline-block">${esc(AUTH.name)}</h2>
<p class="m">Tạo một phòng mới rồi đưa mã 4 số cho học sinh.</p><p class="err" id="er"></p>
<button class="btn o" id="new">▶ TẠO PHÒNG MỚI</button><div id="open"></div></div>
<div class="card"><h2>Hướng dẫn nhanh</h2><p class="small m">1. Bấm <b>Tạo phòng mới</b> → chọn thời gian và bài.<br>2. Học sinh mở <b id="org"></b> và nhập mã phòng.<br>3. Bấm <b>Bắt đầu</b>. Hết giờ, kết quả tự lưu vào lịch sử.</p></div>
</div><div><div class="card"><h2>Lịch sử các ván</h2><div id="hist"><p class="m">Đang tải…</p></div></div></div></div>`;
wireBar();$("#org").textContent=location.host;
$("#new").onclick=async()=>{$("#new").disabled=true;try{const j=await post("/api/admin/create",{auth:AUTH.auth});R={code:j.code,token:j.token};ss("vby-admin",R);connect()}
catch(x){if(x.status==401)return expired();$("#er").textContent=x.message;$("#new").disabled=false}};
try{const me=await get("/api/auth/me?auth="+encodeURIComponent(AUTH.auth));AUTH.name=me.name;ls("vby-auth",AUTH);
if(me.rooms.length&&$("#open"))$("#open").innerHTML=`<div class="lbl" style="text-align:left">Phòng đang mở</div><ul class="lb rooms">${me.rooms.map(r=>`<li data-c="${esc(r.code)}" data-t="${esc(r.token)}"><span class="n">Phòng <b>${esc(r.code)}</b></span><span class="m small">${r.players} người · ${r.phase}</span><span>→</span></li>`).join("")}</ul>`;
document.querySelectorAll(".rooms li").forEach(li=>li.onclick=()=>{R={code:li.dataset.c,token:li.dataset.t};ss("vby-admin",R);connect()})}
catch(x){if(x.status==401)return expired()}
loadHistory()}

async function loadHistory(){const el=$("#hist");if(!el)return;
try{const {results}=await get("/api/admin/history?auth="+encodeURIComponent(AUTH.auth));
if(!results.length){el.innerHTML=`<p class="m">Chưa có ván nào. Kết quả mỗi ván sẽ tự lưu ở đây sau khi kết thúc.</p>`;return}
el.innerHTML=`<ul class="hist">${results.map(r=>{const ps=r.players||[],ans=ps.reduce((a,p)=>a+p.ans,0),ok=ps.reduce((a,p)=>a+p.ok,0),w=ps.filter(p=>p.m0!=null&&p.m1!=null),up=w.filter(p=>p.m1>p.m0).length;
const d=new Date(r.at);return `<li><details><summary><span class="d">${d.toLocaleDateString("vi-VN")} ${d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})} · phòng ${esc(r.code)} · ván ${r.round}
<small>${ps.length} học sinh · đúng ${ans?Math.round(ok/ans*100):0}% · ${w.length?`💚 ${up}/${w.length} nhẹ nhõm hơn`:"chưa có dữ liệu tâm trạng"}</small></span><span>▾</span></summary>
<div class="body"><table><tr><th>#</th><th>Tên</th><th>Đúng</th><th>☀️</th><th>Tâm trạng</th></tr>${ps.sort((a,b)=>b.score-a.score).map((p,i)=>`<tr><td>${i+1}</td><td>${AV.includes(p.av)?p.av:""} ${esc(p.nick)}</td><td>${p.ok}/${p.ans}</td><td>${p.score}</td><td>${p.m0!=null?MOOD[p.m0]:"–"} → ${p.m1!=null?MOOD[p.m1]:"–"}</td></tr>`).join("")}</table>
<div class="row" style="margin-top:8px"><button class="btn s cp" data-id="${r.id}" style="margin:0">Sao chép bảng (dán vào Excel)</button><button class="btn r del" data-id="${r.id}" style="margin:0;flex:0 0 90px">Xóa</button></div></div></details></li>`}).join("")}</ul>`;
el.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{const r=results.find(x=>x.id==b.dataset.id);const t="Tên\tĐúng\tTrả lời\tĐiểm\tTâm trạng trước\tTâm trạng sau\n"+(r.players||[]).map(p=>[p.nick,p.ok,p.ans,p.score,p.m0!=null?p.m0+1:"",p.m1!=null?p.m1+1:""].join("\t")).join("\n");
navigator.clipboard?.writeText(t).then(()=>b.textContent="Đã chép ✓",()=>b.textContent="Không chép được")});
el.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="Chắc chưa?";return}await post("/api/admin/history/delete",{auth:AUTH.auth,id:+b.dataset.id}).catch(()=>{});loadHistory()})}
catch(x){if(x.status==401)return expired();el.innerHTML=`<p class="err">${esc(x.message)}</p>`}}

// ---------- Phòng chơi ----------
function connect(){if(ES)ES.close();known=new Map();logs=[];S=null;
app.innerHTML=`<div class="card c"><p class="m">> đang kết nối phòng ${esc(R.code)}…</p></div>`;
ES=new EventSource(`/api/admin/stream?code=${R.code}&token=${encodeURIComponent(R.token)}`);
ES.addEventListener("state",e=>{try{onState(JSON.parse(e.data))}catch(x){console.error(x)}});
const me=ES;ES.onerror=()=>{setTimeout(()=>{if(ES===me&&me.readyState===2)fetch(`/api/admin/stream?code=${R.code}&token=${R.token}`,{method:"HEAD"}).then(r=>{if(r.status==404){ES=null;R=null;S=null;ss("vby-admin",null);AUTH?dashboard():login("Phòng cũ không còn (máy chủ có thể đã khởi động lại). Hãy tạo phòng mới.")}else connect()}).catch(()=>setTimeout(connect,3000))},2500)}}
const act=(action,extra={})=>post("/api/admin/action",{code:R.code,token:R.token,action,...extra}).catch(e=>log("lỗi: "+e.message));

function log(t){const d=new Date();logs.push(`[${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}] ${t}`);if(logs.length>80)logs.shift();
const el=$("#log");if(el){el.textContent=logs.join("\n");el.scrollTop=1e9}}

function onState(s){const prev=S;S=s;endAt=Date.now()+s.left;
const ids=new Set(s.board.map(p=>p.id));
for(const p of s.board)if(!known.has(p.id)){known.set(p.id,p.nick);if(prev)log(`+ ${p.av} ${p.nick} đã vào phòng`)}
for(const [id,n] of known)if(!ids.has(id)){known.delete(id);log(`- ${n} đã rời phòng`)}
if(!prev||prev.phase!==s.phase||prev.round!==s.round){if(prev)log(`# trạng thái → ${s.phase.toUpperCase()} (ván ${s.round})`);if(prev&&s.phase=="end")log("# kết quả sẽ tự lưu vào lịch sử sau ~45 giây");view()}else{board();stats()}}

function view(){const s=S;const link=location.origin+"/?code="+s.code;
const ctl=s.phase=="lobby"?`
<div class="lbl">Thời gian mỗi ván</div><div class="row" id="dur">${[3,5,8,10,15].map(m=>`<button class="btn s ${s.dur==m*60000?"on":""}" data-m="${m}">${m}′</button>`).join("")}</div>
<div class="lbl">Chủ đề câu hỏi <span class="m small">(không chọn = tất cả)</span></div>
<div class="row" id="qk"><button class="btn s ${same(s.lessons,STRESS)?"on":""}" data-g="s">🌿 Giải tỏa căng thẳng</button><button class="btn s ${same(s.lessons,PHYS)?"on":""}" data-g="p">🔬 Vật lí</button><button class="btn s ${!s.lessons.length?"on":""}" data-g="a">✨ Kết hợp</button></div>
<div class="cmt" style="margin-top:8px;text-align:left">thư giãn</div><div class="chk les">${STRESS.map(k=>chip(k,s)).join("")}</div>
<div class="cmt" style="margin-top:6px;text-align:left">vật lí khtn 7</div><div class="chk les">${PHYS.map(k=>chip(k,s)).join("")}</div>
<button class="btn o" id="st">▶ BẮT ĐẦU VÁN ${s.round}</button>`
:s.phase=="play"?`<div class="cmt c" style="margin-top:12px">thời gian còn lại</div><div class="code" id="tm" style="font-size:60px;letter-spacing:4px;color:var(--cy);text-shadow:0 0 20px #3df0ff">--:--</div>
<button class="btn r" id="en">⏹ Kết thúc sớm</button>`
:`<h2 class="c" style="margin-top:14px">VÁN ${s.round} ĐÃ KẾT THÚC 🌈</h2><button class="btn" id="st">▶ Chơi ván mới</button><button class="btn s" id="rs">↺ Về phòng chờ</button>`;
app.innerHTML=bar()+`<div class="grid2">
<div><div class="card c"><div class="cmt">mã phòng</div><div class="code">${s.code}</div>
<p class="small m">Học sinh mở <b id="lk"></b> và nhập mã, hoặc dùng link:</p>
<div class="row"><input type="text" id="lnk" readonly><button class="btn s" id="cp" style="flex:0 0 110px;margin:0">Sao chép</button></div>
${ctl}</div>
<div class="card"><h2>Thống kê</h2><div class="stat" id="stt"></div><div id="mood"></div></div>
<div class="card"><h2>Nhật ký</h2><div class="log" id="log"></div></div></div>
<div><div class="card"><h2>Bảng xếp hạng</h2><div id="bd"></div></div>
<div class="card"><details><summary><b>📚 Ngân hàng câu hỏi (${Q.length} câu)</b></summary><div class="qlist">${Q.map(q=>`<div><i>${esc(tagOf(q[0]))}</i> ${esc(q[1])}<br>→ ${esc(q[2][q[3]])}</div>`).join("")}</div></details>
<button class="btn r" id="cl">Đóng phòng</button></div></div></div>`;
wireBar();$("#lk").textContent=location.host;$("#lnk").value=link;
$("#cp").onclick=()=>{navigator.clipboard?.writeText(link).then(()=>{$("#cp").textContent="Đã chép ✓"},()=>{$("#lnk").select()})};
$("#cl").onclick=()=>{if($("#cl").dataset.c){act("close").then(()=>{if(ES)ES.close();ES=null;R=null;S=null;ss("vby-admin",null);dashboard()})}else{$("#cl").dataset.c=1;$("#cl").textContent="Bấm lần nữa để xác nhận đóng phòng"}};
if(s.phase=="lobby"){$("#dur").querySelectorAll("button").forEach(b=>b.onclick=()=>act("settings",{dur:+b.dataset.m*60000}));
document.querySelectorAll(".les input").forEach(i=>i.onchange=()=>act("settings",{lessons:[...document.querySelectorAll(".les input:checked")].map(x=>+x.value)}));
$("#qk").querySelectorAll("button").forEach(b=>b.onclick=()=>act("settings",{lessons:b.dataset.g=="s"?STRESS:b.dataset.g=="p"?PHYS:[]}))}
if($("#st"))$("#st").onclick=()=>act("start");
if($("#en"))$("#en").onclick=()=>act("end");
if($("#rs"))$("#rs").onclick=()=>act("reset");
$("#log").textContent=logs.join("\n");board();stats()}

function board(){const el=$("#bd");if(!el)return;const ps=S.board;
if(!ps.length){el.innerHTML=`<p class="m">Chưa có ai vào phòng. Chia sẻ mã <b>${S.code}</b> cho học sinh nhé.</p>`;return}
el.innerHTML=`<ul class="lb">${ps.map((p,i)=>`<li class="${p.online?"":"off"}"><span class="r">${i<3&&S.phase!="lobby"?["🥇","🥈","🥉"][i]:i+1}</span><span class="a">${AV.includes(p.av)?p.av:"🌱"}</span>
<span class="n">${esc(p.nick)}${p.online?"":" <span class='small'>(mất kết nối)</span>"}</span><span class="m small">${p.ok}/${p.ans}</span><span class="s">☀️ ${p.score}</span>
<span title="Tâm trạng trước → sau">${p.m0!=null?MOOD[p.m0]:""}${p.m1!=null?"→"+MOOD[p.m1]:""}</span><button class="x" data-id="${esc(p.id)}" title="Mời ra khỏi phòng">✕</button></li>`).join("")}</ul>`;
el.querySelectorAll(".x").forEach(b=>b.onclick=()=>act("kick",{pid:b.dataset.id}))}

function stats(){const el=$("#stt");if(!el)return;const ps=S.board,on=ps.filter(p=>p.online).length,ans=ps.reduce((a,p)=>a+p.ans,0),ok=ps.reduce((a,p)=>a+p.ok,0);
el.innerHTML=`<div><b>${ps.length}</b>người chơi<br><span class="small">${on} đang online</span></div><div><b>${ans?Math.round(ok/ans*100):0}%</b>trả lời đúng</div><div><b>${ans}</b>lượt trả lời</div>`;
const w=ps.filter(p=>p.m0!=null&&p.m1!=null),up=w.filter(p=>p.m1>p.m0).length,same=w.filter(p=>p.m1==p.m0).length;
const avg0=ps.filter(p=>p.m0!=null),a0=avg0.length?avg0.reduce((a,p)=>a+p.m0,0)/avg0.length:null;
$("#mood").innerHTML=`<div class="lbl">Tâm trạng của lớp</div>`+(a0!=null?`<p>Trước khi chơi (trung bình): <b>${MOOD[Math.round(a0)]}</b></p>`:"")+
(w.length?`<div class="msg ok">💚 ${up}/${w.length} bạn thấy nhẹ nhõm hơn · ${same} bạn giữ nguyên · ${w.length-up-same} bạn còn mệt</div>`
:`<p class="m small">Kết quả "sau khi chơi" sẽ hiện khi học sinh chọn biểu cảm ở màn hình kết thúc.</p>`)+
(w.length-up-same>0?`<p class="small m">Gợi ý: hỏi thăm riêng những bạn đánh dấu 😣/😟 ở cột tâm trạng.</p>`:"")}

setInterval(()=>{if(S&&S.phase=="play"){const t=$("#tm");if(t)t.textContent=fmt(Math.max(0,endAt-Date.now()))}},500);
(function(){if(!AUTH||!AUTH.auth)return login();const r=ss("vby-admin");if(r&&r.code){R=r;connect()}else dashboard()})();
</script>
</body>
</html>
