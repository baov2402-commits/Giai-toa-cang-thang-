<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vườn Bình Yên – Game KHTN 7 Vật lí</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* Vườn Bình Yên – giao diện "hacker xanh" */
:root{--bg:#020a06;--card:#04140cdd;--t:#c8ffd9;--m:#5fae80;--g:#00ff88;--g2:#00ff8822;--gd:#00b862;--l:#0f3d26;--cy:#3df0ff;--lime:#b6ff3d;--tl:#2bd9a8;--mint:#7dffc4;
--glow:0 0 8px #00ff8866,0 0 22px #00ff8822;--mono:"JetBrains Mono","Cascadia Mono","Courier New","Noto Sans Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:500 16px/1.5 var(--mono);color:var(--t);background:radial-gradient(ellipse at top,#062a17 0%,var(--bg) 65%);min-height:100vh;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000022 2px 3px)}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35}
.w{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--l);border-radius:10px;box-shadow:var(--glow),inset 0 0 40px #00ff880a;padding:20px;margin-bottom:14px;backdrop-filter:blur(3px);position:relative}
.card::before{content:"● ● ●";position:absolute;top:6px;left:12px;font-size:9px;letter-spacing:3px;color:#1d6b43}
h1{font-size:38px;line-height:1.1;margin:8px 0 6px;color:var(--g);font-weight:800;text-shadow:0 0 12px #00ff88aa;letter-spacing:1px}
h1::after{content:"_";animation:blink 1s steps(1) infinite}
h2{font-size:22px;margin:6px 0 10px;font-weight:800;color:var(--g);text-shadow:0 0 8px #00ff8877}
h2::before{content:"> ";color:var(--m)}
@keyframes blink{50%{opacity:0}}
p{margin:6px 0}.m{color:var(--m)}.c{text-align:center}.small{font-size:13px}.err{color:#ff7b9c;min-height:1.2em;margin:8px 0 0}
.cmt{color:var(--m);font-size:13px}.cmt::before{content:"// "}
.btn{display:block;width:100%;border:1px solid var(--g);border-radius:8px;padding:13px 16px;font:700 17px var(--mono);cursor:pointer;color:#001a0c;background:var(--g);
box-shadow:0 0 14px #00ff8866;margin-top:10px;transition:transform .08s,box-shadow .2s;text-transform:none}
.btn:hover{box-shadow:0 0 24px #00ff88aa}
.btn:active{transform:translateY(2px)}
.btn.s{background:transparent;color:var(--g);box-shadow:none}
.btn.s:hover{background:var(--g2)}
.btn.s.on{background:var(--g2);box-shadow:inset 0 0 0 1px var(--g),0 0 12px #00ff8855}
.btn.p{background:var(--cy);border-color:var(--cy);box-shadow:0 0 14px #3df0ff66}
.btn.o{background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px #b6ff3d66}
.btn.r{background:transparent;color:#ff7b9c;border-color:#ff7b9c;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--l);font:600 18px var(--mono);color:var(--g);background:#010805;caret-color:var(--g)}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 12px #00ff8855}
input::placeholder{color:#2c6b4a}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.av button,.mood button{font-size:30px;border:1px solid var(--l);background:#010805;border-radius:8px;padding:6px 0;cursor:pointer}
.av button.on,.mood button.on{border-color:var(--g);background:var(--g2);box-shadow:0 0 12px #00ff8866}
.mood{display:flex;gap:8px;margin:8px 0}.mood button{flex:1}
.lbl{font-weight:700;margin-top:16px;color:var(--cy)}
.lbl::before{content:"$ ";color:var(--m)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--l);border-radius:10px;padding:8px 12px;box-shadow:var(--glow);margin-bottom:12px}
.top .me{font-size:28px}.top .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g)}
.pill{border:1px solid var(--lime);color:var(--lime);border-radius:6px;padding:2px 10px;font-weight:800;white-space:nowrap;font-size:14px}
.pill.tm{border-color:var(--cy);color:var(--cy)}
.ic{border:1px solid var(--l);background:#010805;border-radius:6px;font-size:18px;padding:3px 7px;cursor:pointer}
.ic:hover{border-color:var(--g)}
.garden{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2px;font-size:22px;min-height:38px;padding:6px 10px;border-radius:8px;border:1px dashed #1d6b43;background:linear-gradient(#00ff8808,#00ff8818);margin-bottom:12px;align-items:flex-end}
.garden span{animation:pop .5s ease;filter:drop-shadow(0 0 4px #00ff8866)}
.garden .e{color:var(--m);font-size:13px;filter:none}
@keyframes pop{0%{transform:scale(0) translateY(10px)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.tag{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:4px;padding:1px 10px;font-weight:700;font-size:13px;background:var(--g2)}
.q{font-size:21px;font-weight:700;margin:12px 0 4px;color:#eafff1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ans button{position:relative;border:1px solid;border-radius:8px;padding:16px 14px 16px 44px;min-height:84px;font:700 16px/1.3 var(--mono);cursor:pointer;text-align:left;background:#010805;transition:transform .08s,background .15s}
.ans button::before{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.9}
.ans .b0{color:var(--g);border-color:var(--g)}.ans .b0::before{content:"[A]"}
.ans .b1{color:var(--cy);border-color:var(--cy)}.ans .b1::before{content:"[B]"}
.ans .b2{color:var(--lime);border-color:var(--lime)}.ans .b2::before{content:"[C]"}
.ans .b3{color:var(--mint);border-color:var(--mint)}.ans .b3::before{content:"[D]"}
.ans button:hover{background:#00ff8814;box-shadow:0 0 14px currentColor}
.ans button:active{transform:translateY(2px)}
.ans button.dim{opacity:.25}.ans button.ok{background:#00ff8826;box-shadow:0 0 18px currentColor}
@media(max-width:560px){.ans{grid-template-columns:1fr}.ans button{min-height:58px}h1{font-size:30px}}
.boxes{display:flex;gap:12px;margin-top:12px}
.boxes button{flex:1;border:1px solid var(--g);background:#010805;border-radius:8px;padding:14px 6px;cursor:pointer;font:700 14px var(--mono);color:var(--g)}
.boxes button:hover{box-shadow:0 0 18px #00ff8888;background:var(--g2)}
.boxes button .e{font-size:46px;display:block;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #00ff8899)}
.boxes button:nth-child(2) .e{animation-delay:.3s}.boxes button:nth-child(3) .e{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.reveal{font-size:66px;animation:pop .6s ease;filter:drop-shadow(0 0 12px #00ff88)}
.msg{border-left:3px solid #ffb86b;background:#ffb86b12;border-radius:4px;padding:10px 14px;margin-top:12px}
.msg.ok{border-color:var(--g);background:var(--g2)}
.breath{width:190px;height:190px;margin:22px auto;border-radius:50%;border:2px solid var(--g);background:radial-gradient(circle,#00ff8833,#00ff8808 70%);display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:19px;color:var(--g);transform:scale(.6);transition:transform 4s ease-in-out;box-shadow:0 0 30px #00ff8855,inset 0 0 30px #00ff8833;text-shadow:0 0 8px #00ff88}
.lb{list-style:none;padding:0;margin:8px 0}
.lb li{display:flex;align-items:center;gap:10px;border:1px solid var(--l);background:#010805;border-radius:6px;padding:7px 12px;margin:6px 0}
.lb .r{font-weight:800;width:30px;color:var(--m)}.lb .a{font-size:24px}.lb .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .s{font-weight:800;color:var(--lime)}.lb li.me{border-color:var(--g);background:var(--g2)}
.lb .off{opacity:.45}
.lb .x{border:1px solid #ff7b9c55;color:#ff7b9c;background:none;border-radius:4px;cursor:pointer;font:600 12px var(--mono);padding:2px 6px}
.code{font-size:72px;font-weight:800;letter-spacing:14px;color:var(--g);text-align:center;line-height:1.1;text-shadow:0 0 20px #00ff88,0 0 40px #00ff8866}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;border:1px solid var(--l);background:#010805;border-radius:8px;padding:10px;text-align:center;font-size:13px;color:var(--m)}
.stat b{display:block;font-size:24px;color:var(--g);text-shadow:0 0 8px #00ff8877}
.hide{display:none!important}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:36px;font-weight:800;color:var(--lime);text-shadow:0 0 14px var(--lime);pointer-events:none;animation:up 1.2s ease forwards;z-index:60}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.leaf{position:fixed;top:-40px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:2;opacity:.6}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
details summary{cursor:pointer;color:var(--cy)}
.term{font-size:13px;color:var(--m);text-align:left;margin:10px 0 0;min-height:4.6em;white-space:pre-wrap}
.term b{color:var(--g)}
a{color:var(--cy)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chk label{border:1px solid var(--l);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;background:#010805}
.chk label.on{border-color:var(--g);color:var(--g);background:var(--g2)}
.chk input{display:none}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>

<div class="w" id="app"></div>
<script>
// Mưa ký tự code kiểu "hacker" – rơi chậm, dịu mắt. Ký tự lấy từ công thức Vật lí 7.
(function(){
  const cv=document.createElement("canvas");cv.id="rain";document.body.prepend(cv);
  const ctx=cv.getContext("2d");
  const TOK="v=s/t 01 Hz dB N S i=i' km/h m/s 3,6 1/15 20000 λ ∆ Φ B ⚡ ☀ { } < > / = + 0 1 0 1 ア イ ウ エ".split(" ").join("").split("");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,cols,drops,fs=16;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/fs);drops=Array.from({length:cols},()=>Math.random()*-H/fs)}
  addEventListener("resize",rs);rs();
  let last=0;
  function draw(t){requestAnimationFrame(draw);if(t-last<70)return;last=t;
    ctx.fillStyle="rgba(2,10,6,0.12)";ctx.fillRect(0,0,W,H);
    ctx.font=fs+"px JetBrains Mono, monospace";
    for(let i=0;i<cols;i++){
      const ch=TOK[Math.random()*TOK.length|0],y=drops[i]*fs;
      ctx.fillStyle=Math.random()<.04?"#d8ffe6":(i%3?"#00ff88":"#3df0ff");
      ctx.fillText(ch,i*fs,y);
      if(y>H&&Math.random()>.975)drops[i]=0;
      drops[i]+=.55;
    }
  }
  if(!reduce)requestAnimationFrame(draw);
  // Gõ chữ kiểu terminal: typeLines(el, ["dòng 1","dòng 2"])
  window.typeLines=function(el,lines,speed=18){if(!el)return;el.textContent="";let i=0,j=0;
    (function step(){if(!el.isConnected||i>=lines.length)return;if(j<=lines[i].length){el.textContent=lines.slice(0,i).join("\n")+(i?"\n":"")+lines[i].slice(0,j)+"▌";j++;setTimeout(step,speed)}
    else{i++;j=0;setTimeout(step,180)}})()};
})();
</script>

[10,"Đồ thị s–t của vật chuyển động đều có dạng:",["Đường thẳng xiên lên","Đường tròn","Đường nằm ngang","Đường gấp khúc đi xuống"],0,"Chuyển động đều: s tăng đều theo t → đường thẳng xiên lên."],

[12,"Âm truyền nhanh nhất trong:",["Thép","Nước","Không khí","Chân không"],0,"Tốc độ truyền âm: rắn > lỏng > khí. Trong thép khoảng 6100 m/s."],
[12,"Các nguồn âm đều có chung đặc điểm:",["Đều dao động","Đều nóng lên","Đều phát sáng","Đều đứng yên"],0,"Âm thanh do các vật dao động phát ra."],

l.frequency.value=.05+i*.03;lg.gain.value=.2;l.connect(lg);lg.connect(v.gain);x.connect(v);v.connect(g);x.start();l.start();return x});amb={g,o}}
function toggleSnd(){sndOn=!sndOn;ambient(sndOn&&!!P&&!P.ended);document.querySelectorAll(".snd").forEach(b=>b.textContent=sndOn?"🔊":"🔈")}
function leaves(n=6){for(let i=0;i<n;i++){const l=document.createElement("div");l.className="leaf";l.textContent=["🍃","🌸","✨","🍀"][i%4];l.style.left=Math.random()*95+"vw";
l.style.animationDuration=5+Math.random()*5+"s";l.style.animationDelay=Math.random()*2+"s";document.body.append(l);setTimeout(()=>l.remove(),12000)}}
function floatTxt(t){const d=document.createElement("div");d.className="float";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1300)}

// ---------- Trang chính ----------
function home(){P=null;ambient(false);leaveRoom();
const code=new URLSearchParams(location.search).get("code")||"";
app.innerHTML=`<div class="card c">
<div class="cmt">chu_de: giai_toa_cang_thang // khtn7.vat-li</div>
<h1>VƯỜN_BÌNH_YÊN</h1>
<div class="term" id="term"></div>
<p class="m">Game giải tỏa căng thẳng: học cách thở, ngủ, gọi tên cảm xúc và tìm người hỗ trợ, kèm ôn Vật lí KHTN 7. Mở hộp quà, trồng khu vườn của riêng bạn, nghỉ hít thở giữa chừng. Trả lời sai không bị trừ điểm, cứ thoải mái mà chơi!</p>
<button class="btn p" id="join">🚪 Vào phòng của lớp</button>
<button class="btn" id="solo">🌱 Chơi một mình</button>
<p class="m small" style="margin-top:14px">${Q.filter(q=>q[0]>30).length} câu giải tỏa căng thẳng · ${Q.filter(q=>q[0]<30).length} câu Vật lí KHTN 7</p>
</div>`;
typeLines($("#term"),["> khởi động hệ thống thư giãn... [OK]","> nạp "+Q.length+" câu hỏi thư giãn + Vật lí... [OK]","> mức căng thẳng: đang giảm dần 🌿"]);
$("#solo").onclick=()=>{ac();setup("solo")};$("#join").onclick=()=>{ac();setup("join",code)};
if(code)setup("join",code)}

function setup(mode,code=""){
app.innerHTML=`<div class="card">
<h2>${mode=="join"?"Vào phòng chơi":"Chuẩn bị nào"}</h2>
${mode=="join"?`<div class="lbl">Mã phòng (4 số)</div><input type="text" id="code" inputmode="numeric" maxlength="4" placeholder="VD: 2468" value="${esc(code.replace(/\D/g,"").slice(0,4))}">`:""}
<div class="lbl">Tên của bạn</div><input type="text" id="nick" maxlength="16" placeholder="Biệt danh" value="${esc(G.nick)}">
<div class="lbl">Chọn bạn đồng hành</div><div class="av" id="av">${AV.map(a=>`<button class="${a==G.av?"on":""}">${a}</button>`).join("")}</div>
<div class="lbl">Lúc này bạn cảm thấy thế nào?</div><div class="mood" id="md">${MOOD.map((e,i)=>`<button title="${MOODT[i]}">${e}</button>`).join("")}</div>
<p class="m small c" id="mdt">Chọn một biểu cảm thật lòng nhé — không ai chấm điểm cái này đâu.</p>
${mode=="solo"?`<div class="lbl">Chủ đề</div><div class="row" id="top"><button class="btn s on" data-t="s">🌿 Giải tỏa căng thẳng</button><button class="btn s" data-t="p">🔬 Vật lí KHTN 7</button><button class="btn s" data-t="a">✨ Kết hợp</button></div>
<div class="lbl">Số câu hỏi</div><div class="row" id="len"><button class="btn s" data-n="10">10 câu</button><button class="btn s" data-n="20">20 câu</button><button class="btn s" data-n="999">Tất cả</button></div>`:`<p class="err" id="er"></p><button class="btn p" id="go">Vào phòng →</button>`}
<button class="btn s" id="back">← Quay lại</button></div>`;
$("#back").onclick=()=>{history.replaceState(null,"",location.pathname);home()};
$("#av").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{G.av=AV[i];$("#av").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b))});
$("#md").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{G.m0=i;$("#md").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));$("#mdt").textContent=MOODT[i]});
const ok=()=>{G.nick=($("#nick").value||"").trim().slice(0,16);if(!G.nick){$("#nick").focus();$("#nick").placeholder="Nhập tên trước nhé 🙂";return false}if(G.m0==null)G.m0=2;save();return true};
if(mode=="solo"){let top="s";$("#top").querySelectorAll("button").forEach(b=>b.onclick=()=>{top=b.dataset.t;$("#top").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b))});
$("#len").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(!ok())return;const pool=top=="s"?Q.filter(q=>q[0]>30):top=="p"?Q.filter(q=>q[0]<30):Q;start({n:Math.min(+b.dataset.n,pool.length),pool})})}
else $("#go").onclick=async()=>{const c=($("#code").value||"").replace(/\D/g,"");if(c.length!=4){$("#er").textContent="Mã phòng gồm 4 chữ số.";$("#code").focus();return}if(!ok())return;
$("#go").disabled=true;$("#go").textContent="Đang vào…";$("#er").textContent="";
try{await joinRoom(c)}catch(e){$("#er").textContent=e.message;$("#go").disabled=false;$("#go").textContent="Thử lại"}}}

function newSession(o){return{qs:shuf(Q),i:0,score:0,ok:0,ans:0,streak:0,best:0,garden:[],breaths:0,miss:[],...o}}
function start(o){P=newSession({...o,qs:shuf(o.pool||Q)});G.m1=null;ambient(sndOn);leaves(8);question()}

function topBar(){return `<div class="top"><span class="me">${G.av}</span><span class="nm">${esc(G.nick)}</span>
${P.live?`<span class="pill tm" id="tm">⏱ --:--</span>`:`<span class="pill tm">${Math.min(P.i+1,P.n)}/${P.n}</span>`}
<span class="pill" id="sc">☀️ ${P.score}</span><button class="ic snd" onclick="toggleSnd()">${sndOn?"🔊":"🔈"}</button><button class="ic" onclick="breathe(true)" title="Nghỉ hít thở">🫧</button></div>
<div class="garden">${P.garden.length?P.garden.map(p=>`<span>${p}</span>`).join(""):`<span class="e">Khu vườn của bạn sẽ mọc lên ở đây…</span>`}</div>`}

function question(){if(!P||P.ended)return;
if(!P.live&&P.i>=P.n)return finish();
if(P.i>=P.qs.length)P.qs=P.qs.concat(P.pool?shuf(P.pool):shuf(Q));
const q=P.qs[P.i],order=shuf([0,1,2,3]);
app.innerHTML=topBar()+`<div class="card"><span class="tag">${tagOf(q[0])}</span><div class="q">${esc(q[1])}</div>
<div class="ans">${order.map((k,j)=>`<button class="b${j}" data-k="${k}">${esc(q[2][k])}</button>`).join("")}</div><div id="fb"></div></div>`;
tick();app.querySelectorAll(".ans button").forEach(b=>b.onclick=()=>answer(+b.dataset.k,q))}

function answer(k,q){if(P.locked||P.ended)return;P.locked=1;P.ans++;const right=k==q[3];
app.querySelectorAll(".ans button").forEach(b=>{b.onclick=null;const kk=+b.dataset.k;b.classList.toggle("dim",kk!=q[3]);b.classList.toggle("ok",kk==q[3])});
if(right){P.ok++;P.streak++;P.best=Math.max(P.best,P.streak);chime();
let bonus="";if(P.streak%3==0){P.score+=10;bonus=`<br>🔥 Chuỗi ${P.streak} câu đúng liên tiếp: <b>+10 ☀️</b>`}
$("#fb").innerHTML=`<div class="msg ok"><b>Chính xác! 🎉</b> ${esc(q[4])}${bonus}</div><div class="lbl c">Chọn một hộp quà:</div>
<div class="boxes">${BOX.map((b,i)=>`<button data-i="${i}"><span class="e">${b.e}</span>${b.n}</button>`).join("")}</div>`;
$("#fb").querySelectorAll(".boxes button").forEach(b=>b.onclick=()=>openBox())}
else{P.streak=0;soft();P.miss.push(q);
$("#fb").innerHTML=`<div class="msg"><b>${WRONG[Math.random()*WRONG.length|0]}</b><br>Đáp án đúng: <b>${esc(q[2][q[3]])}</b><br>${esc(q[4])}</div><button class="btn" id="nx">Tiếp tục 🌿</button>`;
$("#nx").onclick=next}
sync()}

function openBox(){if(P.opened===P.i)return;P.opened=P.i;let r=Math.random()*100,rw=REW[0];for(const x of REW){if(r<x.w){rw=x;break}r-=x.w}
P.score+=rw.v;P.garden.push(rw.p);floatTxt("+"+rw.v+" ☀️");
$("#fb").querySelector(".boxes").outerHTML=`<div class="c"><div class="reveal">${rw.p}</div><b style="font-size:22px">+${rw.v} ☀️</b>${rw.v>=60?" — hiếm lắm đó! ✨":""}
<p class="m">${NICE[Math.random()*NICE.length|0]}</p></div><button class="btn" id="nx">Câu tiếp theo →</button>`;
$("#nx").onclick=next;const sc=$("#sc");if(sc)sc.textContent="☀️ "+P.score;sync()}

function next(){if(!P||P.ended)return;P.locked=0;P.i++;
if(P.ans>0&&P.ans%5==0&&(P.live||P.i<P.n))return breathe(false);question()}

// ---------- Trạm hít thở ----------
let BT=null;
function breathe(manual){if(!P||P.ended)return;clearTimeout(BT);const back=()=>{clearTimeout(BT);if(P&&!P.ended)question()};
app.innerHTML=topBar()+`<div class="card c"><h2>🫧 Trạm hít thở</h2><p class="m">Ngồi thẳng, thả lỏng vai. Nhìn vòng tròn và thở theo nhé.</p>
<div class="breath" id="br">Sẵn sàng…</div><p id="bc" class="m">Nhịp 4 – 4 – 4 · 3 lượt</p>
<button class="btn s" id="sk">${manual?"Quay lại chơi":"Bỏ qua"}</button></div>`;
tick();$("#sk").onclick=back;
const steps=[["Hít vào…",1.15],["Giữ hơi…",1.15],["Thở ra…",.6]];let s=0,cyc=0;
const run=()=>{const el=$("#br");if(!el||!P)return;if(cyc>=3){el.textContent="Tuyệt vời 💚";el.style.transform="scale(.9)";
if(!manual||!P.breathBonus){P.breaths++;P.score+=15;P.garden.push("🍀");floatTxt("+15 ☀️");if(manual)P.breathBonus=1;sync()}
$("#bc").textContent="Bạn nhận được +15 ☀️ và một cây cỏ bốn lá 🍀";$("#sk").textContent="Chơi tiếp →";return}
const [t,sc]=steps[s];el.textContent=t;el.style.transform=`scale(${sc})`;if(s==0)tone(262,3.5,.04);if(s==2)tone(196,3.5,.04);
$("#bc").textContent=`Lượt ${cyc+1}/3`;s++;if(s==3){s=0;cyc++}BT=setTimeout(run,4000)};BT=setTimeout(run,600)}

// ---------- Kết thúc ----------
function finish(){if(!P||P.finished)return;P.finished=1;P.ended=1;clearTimeout(BT);clearInterval(TI);sync(true);ambient(false);leaves(14);chime();
app.innerHTML=`<div class="card c"><div style="font-size:48px">🌈</div><h2>${P.live?"Hết giờ! ":""}Khu vườn của ${esc(G.nick)}</h2>
<div class="garden" style="justify-content:center;font-size:30px">${P.garden.map(p=>`<span>${p}</span>`).join("")||"🌱"}</div>
<div class="stat"><div><b>☀️ ${P.score}</b>điểm nắng</div><div><b>${P.ok}/${P.ans}</b>câu đúng</div><div><b>🔥 ${P.best}</b>chuỗi dài nhất</div></div>
<div class="lbl">Bây giờ bạn cảm thấy thế nào?</div><div class="mood" id="md2">${MOOD.map(e=>`<button>${e}</button>`).join("")}</div><p id="mres" class="m"></p>
<div id="lbw"></div>
${P.miss.length?`<details style="text-align:left;margin-top:10px"><summary><b>📘 Ôn lại ${new Set(P.miss).size} câu chưa đúng</b></summary>${[...new Set(P.miss)].map(q=>`<div class="msg"><b>${tagOf(q[0])}:</b> ${esc(q[1])}<br>→ <b>${esc(q[2][q[3]])}</b>. ${esc(q[4])}</div>`).join("")}</details>`:""}
${P.live?`<p class="m small" style="margin-top:12px">Chờ thầy/cô mở ván mới, hoặc:</p><button class="btn s" id="hm">🚪 Rời phòng</button>`:`<button class="btn" id="again">🌱 Chơi lại</button><button class="btn s" id="hm">🏠 Trang chính</button>`}</div>`;
$("#md2").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{G.m1=i;$("#md2").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));
const d=i-G.m0;$("#mres").innerHTML=d>0?`Từ ${MOOD[G.m0]} lên ${MOOD[i]} — tâm trạng của bạn đã nhẹ nhõm hơn rồi! 💚`:d==0?`Vẫn là ${MOOD[i]}. Cảm ơn bạn đã dành thời gian cho bản thân 🌿`:`Hôm nay có vẻ hơi mệt. Hãy nghỉ ngơi và trò chuyện với người bạn tin tưởng nhé 💛`;sync(true)});
if(!P.live)$("#again").onclick=()=>start({n:P.n});
$("#hm").onclick=()=>{history.replaceState(null,"",location.pathname);home()};
if(P.live&&NET&&NET.state)renderBoard(NET.state)}

// ---------- Hẹn giờ ----------
let TI=null;
function tick(){clearInterval(TI);if(!P||!P.live)return;const f=()=>{const el=$("#tm"),l=Math.max(0,P.endAt-Date.now());if(el)el.textContent="⏱ "+fmt(l)};f();TI=setInterval(f,500)}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

// ---------- Kết nối phòng ----------
let ST=null,lastSent="";
function sync(now){if(!NET||!P||!P.live)return;clearTimeout(ST);
const send=()=>{const b={code:NET.code,pid:NET.pid,secret:NET.secret,round:NET.round,score:P.score,ok:P.ok,ans:P.ans,done:!!P.finished,m1:G.m1},k=JSON.stringify(b);
if(k===lastSent)return;lastSent=k;post("/api/update",b).catch(()=>{lastSent=""})};
now?send():ST=setTimeout(send,300)}
async function joinRoom(code){
const j=await post("/api/join",{code,nick:G.nick,av:G.av,m0:G.m0});
NET={code,pid:j.pid,secret:j.secret,round:j.state.round,state:j.state};
try{sessionStorage.setItem("vby-net",JSON.stringify({code,pid:j.pid,secret:j.secret}))}catch(e){}
history.replaceState(null,"","?code="+code);
P=newSession({live:true,waiting:1,ended:1});G.m1=null;openStream();onState(j.state,true)}
function openStream(){if(!NET)return;if(NET.es)NET.es.close();
const es=new EventSource(`/api/stream?code=${NET.code}&pid=${encodeURIComponent(NET.pid)}&secret=${encodeURIComponent(NET.secret)}`);NET.es=es;
es.addEventListener("state",e=>{try{onState(JSON.parse(e.data))}catch(x){}});
es.addEventListener("kicked",()=>gone("Bạn đã được mời ra khỏi phòng."));
es.addEventListener("closed",()=>gone("Phòng đã đóng. Cảm ơn bạn đã chơi! 🌿"));
es.onerror=()=>{const net=NET;setTimeout(()=>{if(NET===net&&es.readyState===2)fetch(`/api/stream?code=${net.code}&pid=${net.pid}&secret=${net.secret}`,{method:"HEAD"}).then(r=>{if(r.status==404)gone("Phòng không còn nữa (máy chủ có thể đã khởi động lại).");else openStream()}).catch(()=>setTimeout(openStream,3000))},2500)}}
function gone(msg){leaveRoom(true);P=null;ambient(false);history.replaceState(null,"",location.pathname);
app.innerHTML=`<div class="card c"><div style="font-size:48px">🍃</div><p>${esc(msg)}</p><button class="btn" onclick="home()">🏠 Trang chính</button></div>`}
function leaveRoom(silent){clearInterval(TI);if(!NET)return;const n=NET;NET=null;if(n.es)n.es.close();
try{sessionStorage.removeItem("vby-net")}catch(e){}
if(!silent)post("/api/leave",{code:n.code,pid:n.pid,secret:n.secret}).catch(()=>{})}

function onState(s,first){if(!NET||!P)return;NET.state=s;
const pool=s.lessons&&s.lessons.length?Q.filter(q=>s.lessons.includes(q[0])):Q;
if(s.round!==NET.round){NET.round=s.round;lastSent="";P=newSession({live:true,waiting:1,ended:1});G.m1=null}
if(s.phase==="lobby"){if(!P.waiting||first||!$("#wl")){P=newSession({live:true,waiting:1,ended:1});waitScreen()}lobbyList(s)}
else if(s.phase==="play"){
 if(P.waiting){P=newSession({live:true,pool,qs:shuf(pool),endAt:Date.now()+s.left});
  if(NET.restored){const me=(s.board||[]).find(p=>p.id===s.me);if(me)Object.assign(P,{score:me.score,ok:me.ok,ans:me.ans});NET.restored=0}ambient(sndOn);leaves(8);sync(true);question()}
 else if(!P.finished)P.endAt=Date.now()+s.left;
 if(!P.finished&&s.left<=0)finish()}
else if(s.phase==="end"){
 if(P.waiting){P=newSession({live:true,ended:1,finished:0});P.waiting=0;finish()}
 else if(!P.finished)finish();
 else renderBoard(s)}}

function waitScreen(){app.innerHTML=`<div class="card c"><h2>Đã vào phòng ${esc(NET.code)} 🎉</h2><p class="m">Đang chờ thầy/cô bắt đầu… Trong lúc chờ, thở cùng vòng tròn nhé.</p>
<div class="breath" id="wb">${G.av}</div><div id="wl"></div><button class="btn s" id="lv">Rời phòng</button></div>`;
$("#lv").onclick=()=>{history.replaceState(null,"",location.pathname);home()};
let big=0;const b=()=>{const el=$("#wb");if(!el)return;big=!big;el.style.transform=`scale(${big?1.1:.65})`;setTimeout(b,4000)};setTimeout(b,300)}
function lobbyList(s){const el=$("#wl");if(!el)return;const ps=s.board||[];
el.innerHTML=`<p><b>${ps.length}</b> người trong phòng</p><div style="font-size:28px;line-height:1.4">${ps.map(p=>`<span title="${esc(p.nick)}">${AV.includes(p.av)?p.av:"🌱"}</span>`).join(" ")}</div>`}
function renderBoard(s){const el=$("#lbw");if(!el)return;const ps=s.board||[];if(!ps.length){el.innerHTML="";return}
el.innerHTML=`<div class="lbl" style="text-align:left">🏆 Bảng vườn của lớp</div><ul class="lb">${ps.slice(0,20).map((p,i)=>`<li class="${p.id===s.me?"me":""}"><span class="r">${i<3?["🥇","🥈","🥉"][i]:i+1}</span>
<span class="a">${AV.includes(p.av)?p.av:"🌱"}</span><span class="n">${esc(p.nick)}${p.id===s.me?" (bạn)":""}</span>
<span class="m small">${p.ok}/${p.ans}</span><span class="s">☀️ ${p.score}</span></li>`).join("")}</ul>`}

// ---------- Khởi động (khôi phục nếu lỡ tải lại trang) ----------
(function(){let n=null;try{n=JSON.parse(sessionStorage.getItem("vby-net")||"null")}catch(e){}
if(n&&n.code){NET={...n,round:-1,restored:1};P=newSession({live:true,waiting:1,ended:1});app.innerHTML=`<div class="card c"><p class="m">Đang vào lại phòng ${esc(n.code)}…</p></div>`;openStream()}
else home()})();
</script>
</body>
</html>
