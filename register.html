<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo tài khoản giáo viên – Vườn Bình Yên</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&subset=vietnamese&display=swap" rel="stylesheet">
<style>
/* Vườn Bình Yên – giao diện "hacker xanh" */
:root{--bg:#020a06;--card:#04140cdd;--t:#c8ffd9;--m:#5fae80;--g:#00ff88;--g2:#00ff8822;--gd:#00b862;--l:#0f3d26;--cy:#3df0ff;--lime:#b6ff3d;--tl:#2bd9a8;--mint:#7dffc4;
--glow:0 0 8px #00ff8866,0 0 22px #00ff8822;--mono:"JetBrains Mono","Cascadia Mono","Courier New","Noto Sans Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:500 16px/1.5 var(--mono);color:var(--t);background:radial-gradient(ellipse at top,#062a17 0%,var(--bg) 65%);min-height:100vh;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000022 2px 3px)}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35}
.w{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--l);border-radius:10px;box-shadow:var(--glow),inset 0 0 40px #00ff880a;padding:20px;margin-bottom:14px;backdrop-filter:blur(3px);position:relative}
.card::before{content:"● ● ●";position:absolute;top:6px;left:12px;font-size:9px;letter-spacing:3px;color:#1d6b43}
h1{font-size:38px;line-height:1.1;margin:8px 0 6px;color:var(--g);font-weight:800;text-shadow:0 0 12px #00ff88aa;letter-spacing:1px}
h1::after{content:"_";animation:blink 1s steps(1) infinite}
h2{font-size:22px;margin:6px 0 10px;font-weight:800;color:var(--g);text-shadow:0 0 8px #00ff8877}
h2::before{content:"> ";color:var(--m)}
@keyframes blink{50%{opacity:0}}
p{margin:6px 0}.m{color:var(--m)}.c{text-align:center}.small{font-size:13px}.err{color:#ff7b9c;min-height:1.2em;margin:8px 0 0}
.cmt{color:var(--m);font-size:13px}.cmt::before{content:"// "}
.btn{display:block;width:100%;border:1px solid var(--g);border-radius:8px;padding:13px 16px;font:700 17px var(--mono);cursor:pointer;color:#001a0c;background:var(--g);
box-shadow:0 0 14px #00ff8866;margin-top:10px;transition:transform .08s,box-shadow .2s;text-transform:none}
.btn:hover{box-shadow:0 0 24px #00ff88aa}
.btn:active{transform:translateY(2px)}
.btn.s{background:transparent;color:var(--g);box-shadow:none}
.btn.s:hover{background:var(--g2)}
.btn.s.on{background:var(--g2);box-shadow:inset 0 0 0 1px var(--g),0 0 12px #00ff8855}
.btn.p{background:var(--cy);border-color:var(--cy);box-shadow:0 0 14px #3df0ff66}
.btn.o{background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px #b6ff3d66}
.btn.r{background:transparent;color:#ff7b9c;border-color:#ff7b9c;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--l);font:600 18px var(--mono);color:var(--g);background:#010805;caret-color:var(--g)}
input:focus{outline:none;border-color:var(--g);box-shadow:0 0 12px #00ff8855}
input::placeholder{color:#2c6b4a}
.av{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.av button,.mood button{font-size:30px;border:1px solid var(--l);background:#010805;border-radius:8px;padding:6px 0;cursor:pointer}
.av button.on,.mood button.on{border-color:var(--g);background:var(--g2);box-shadow:0 0 12px #00ff8866}
.mood{display:flex;gap:8px;margin:8px 0}.mood button{flex:1}
.lbl{font-weight:700;margin-top:16px;color:var(--cy)}
.lbl::before{content:"$ ";color:var(--m)}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--l);border-radius:10px;padding:8px 12px;box-shadow:var(--glow);margin-bottom:12px}
.top .me{font-size:28px}.top .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g)}
.pill{border:1px solid var(--lime);color:var(--lime);border-radius:6px;padding:2px 10px;font-weight:800;white-space:nowrap;font-size:14px}
.pill.tm{border-color:var(--cy);color:var(--cy)}
.ic{border:1px solid var(--l);background:#010805;border-radius:6px;font-size:18px;padding:3px 7px;cursor:pointer}
.ic:hover{border-color:var(--g)}
.garden{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2px;font-size:22px;min-height:38px;padding:6px 10px;border-radius:8px;border:1px dashed #1d6b43;background:linear-gradient(#00ff8808,#00ff8818);margin-bottom:12px;align-items:flex-end}
.garden span{animation:pop .5s ease;filter:drop-shadow(0 0 4px #00ff8866)}
.garden .e{color:var(--m);font-size:13px;filter:none}
@keyframes pop{0%{transform:scale(0) translateY(10px)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.tag{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:4px;padding:1px 10px;font-weight:700;font-size:13px;background:var(--g2)}
.q{font-size:21px;font-weight:700;margin:12px 0 4px;color:#eafff1}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ans button{position:relative;border:1px solid;border-radius:8px;padding:16px 14px 16px 44px;min-height:84px;font:700 16px/1.3 var(--mono);cursor:pointer;text-align:left;background:#010805;transition:transform .08s,background .15s}
.ans button::before{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.9}
.ans .b0{color:var(--g);border-color:var(--g)}.ans .b0::before{content:"[A]"}
.ans .b1{color:var(--cy);border-color:var(--cy)}.ans .b1::before{content:"[B]"}
.ans .b2{color:var(--lime);border-color:var(--lime)}.ans .b2::before{content:"[C]"}
.ans .b3{color:var(--mint);border-color:var(--mint)}.ans .b3::before{content:"[D]"}
.ans button:hover{background:#00ff8814;box-shadow:0 0 14px currentColor}
.ans button:active{transform:translateY(2px)}
.ans button.dim{opacity:.25}.ans button.ok{background:#00ff8826;box-shadow:0 0 18px currentColor}
@media(max-width:560px){.ans{grid-template-columns:1fr}.ans button{min-height:58px}h1{font-size:30px}}
.boxes{display:flex;gap:12px;margin-top:12px}
.boxes button{flex:1;border:1px solid var(--g);background:#010805;border-radius:8px;padding:14px 6px;cursor:pointer;font:700 14px var(--mono);color:var(--g)}
.boxes button:hover{box-shadow:0 0 18px #00ff8888;background:var(--g2)}
.boxes button .e{font-size:46px;display:block;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #00ff8899)}
.boxes button:nth-child(2) .e{animation-delay:.3s}.boxes button:nth-child(3) .e{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.reveal{font-size:66px;animation:pop .6s ease;filter:drop-shadow(0 0 12px #00ff88)}
.msg{border-left:3px solid #ffb86b;background:#ffb86b12;border-radius:4px;padding:10px 14px;margin-top:12px}
.msg.ok{border-color:var(--g);background:var(--g2)}
.breath{width:190px;height:190px;margin:22px auto;border-radius:50%;border:2px solid var(--g);background:radial-gradient(circle,#00ff8833,#00ff8808 70%);display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:19px;color:var(--g);transform:scale(.6);transition:transform 4s ease-in-out;box-shadow:0 0 30px #00ff8855,inset 0 0 30px #00ff8833;text-shadow:0 0 8px #00ff88}
.lb{list-style:none;padding:0;margin:8px 0}
.lb li{display:flex;align-items:center;gap:10px;border:1px solid var(--l);background:#010805;border-radius:6px;padding:7px 12px;margin:6px 0}
.lb .r{font-weight:800;width:30px;color:var(--m)}.lb .a{font-size:24px}.lb .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .s{font-weight:800;color:var(--lime)}.lb li.me{border-color:var(--g);background:var(--g2)}
.lb .off{opacity:.45}
.lb .x{border:1px solid #ff7b9c55;color:#ff7b9c;background:none;border-radius:4px;cursor:pointer;font:600 12px var(--mono);padding:2px 6px}
.code{font-size:72px;font-weight:800;letter-spacing:14px;color:var(--g);text-align:center;line-height:1.1;text-shadow:0 0 20px #00ff88,0 0 40px #00ff8866}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;border:1px solid var(--l);background:#010805;border-radius:8px;padding:10px;text-align:center;font-size:13px;color:var(--m)}
.stat b{display:block;font-size:24px;color:var(--g);text-shadow:0 0 8px #00ff8877}
.hide{display:none!important}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:36px;font-weight:800;color:var(--lime);text-shadow:0 0 14px var(--lime);pointer-events:none;animation:up 1.2s ease forwards;z-index:60}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.leaf{position:fixed;top:-40px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:2;opacity:.6}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
details summary{cursor:pointer;color:var(--cy)}
.term{font-size:13px;color:var(--m);text-align:left;margin:10px 0 0;min-height:4.6em;white-space:pre-wrap}
.term b{color:var(--g)}
a{color:var(--cy)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chk label{border:1px solid var(--l);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;background:#010805}
.chk label.on{border-color:var(--g);color:var(--g);background:var(--g2)}
.chk input{display:none}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
<style>.hint{font-size:12px;color:var(--m);margin-top:4px}.strength{height:4px;border-radius:2px;background:var(--l);margin-top:6px;overflow:hidden}.strength i{display:block;height:100%;width:0;transition:width .3s,background .3s}</style>
</head>
<body>
<div class="w"><div class="card" style="max-width:520px;margin:5vh auto">
<div class="cmt">sudo useradd --role=giao-vien</div>
<h1 style="font-size:28px">TẠO_TÀI_KHOẢN</h1>
<div class="term" id="term"></div>
<form id="f" autocomplete="on">
<div class="lbl">Họ tên</div><input type="text" id="name" maxlength="40" placeholder="VD: Cô Nguyễn Thị Lan" autocomplete="name" required>
<div class="lbl">Email</div><input type="text" id="email" inputmode="email" maxlength="120" placeholder="ten@truong.edu.vn" autocomplete="email" required>
<div class="lbl">Mật khẩu</div><input type="password" id="pw" placeholder="Ít nhất 6 kí tự" autocomplete="new-password" required>
<div class="strength"><i id="st"></i></div>
<div class="lbl">Nhập lại mật khẩu</div><input type="password" id="pw2" placeholder="Nhập lại cho chắc" autocomplete="new-password" required>
<div class="lbl">Mã giáo viên</div><input type="password" id="code" placeholder="Do người quản trị trang cung cấp" autocomplete="off" required>
<p class="hint">Mã này giúp học sinh không tự tạo được tài khoản quản trò. Hỏi người đã cài đặt trang để lấy mã.</p>
<p class="err" id="er"></p>
<button class="btn" id="go" type="submit">Tạo tài khoản →</button>
</form>
<p class="m small c" style="margin-top:14px">Đã có tài khoản? <a href="/admin">Đăng nhập</a> · <a href="/">Trang học sinh</a></p>
</div></div>
<script>
// Mưa ký tự code kiểu "hacker" – rơi chậm, dịu mắt. Ký tự lấy từ công thức Vật lí 7.
(function(){
  const cv=document.createElement("canvas");cv.id="rain";document.body.prepend(cv);
  const ctx=cv.getContext("2d");
  const TOK="v=s/t 01 Hz dB N S i=i' km/h m/s 3,6 1/15 20000 λ ∆ Φ B ⚡ ☀ { } < > / = + 0 1 0 1 ア イ ウ エ".split(" ").join("").split("");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,cols,drops,fs=16;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.ceil(W/fs);drops=Array.from({length:cols},()=>Math.random()*-H/fs)}
  addEventListener("resize",rs);rs();
  let last=0;
  function draw(t){requestAnimationFrame(draw);if(t-last<70)return;last=t;
    ctx.fillStyle="rgba(2,10,6,0.12)";ctx.fillRect(0,0,W,H);
    ctx.font=fs+"px JetBrains Mono, monospace";
    for(let i=0;i<cols;i++){
      const ch=TOK[Math.random()*TOK.length|0],y=drops[i]*fs;
      ctx.fillStyle=Math.random()<.04?"#d8ffe6":(i%3?"#00ff88":"#3df0ff");
      ctx.fillText(ch,i*fs,y);
      if(y>H&&Math.random()>.975)drops[i]=0;
      drops[i]+=.55;
    }
  }
  if(!reduce)requestAnimationFrame(draw);
  // Gõ chữ kiểu terminal: typeLines(el, ["dòng 1","dòng 2"])
  window.typeLines=function(el,lines,speed=18){if(!el)return;el.textContent="";let i=0,j=0;
    (function step(){if(!el.isConnected||i>=lines.length)return;if(j<=lines[i].length){el.textContent=lines.slice(0,i).join("\n")+(i?"\n":"")+lines[i].slice(0,j)+"▌";j++;setTimeout(step,speed)}
    else{i++;j=0;setTimeout(step,180)}})()};
})();
</script>
<script>
const $=s=>document.querySelector(s);
typeLines($("#term"),["> tạo tài khoản quản trò cho giáo viên","> mỗi giáo viên có phòng chơi và lịch sử riêng"]);
$("#pw").oninput=()=>{const v=$("#pw").value,sc=(v.length>=6)+(v.length>=10)+(/[0-9]/.test(v))+(/[^a-zA-Z0-9]/.test(v))+(/[A-Z]/.test(v)&&/[a-z]/.test(v));
$("#st").style.width=sc*20+"%";$("#st").style.background=sc<2?"#ff7b9c":sc<4?"#ffb86b":"var(--g)"};
$("#f").onsubmit=async e=>{e.preventDefault();const er=$("#er");er.textContent="";
const b={name:$("#name").value.trim(),email:$("#email").value.trim(),password:$("#pw").value,code:$("#code").value};
if(!b.name)return er.textContent="Bạn cần nhập họ tên.";
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email))return er.textContent="Email chưa đúng dạng.";
if(b.password.length<6)return er.textContent="Mật khẩu cần ít nhất 6 kí tự.";
if(b.password!==$("#pw2").value)return er.textContent="Hai mật khẩu chưa giống nhau.";
if(!b.code)return er.textContent="Bạn cần nhập mã giáo viên.";
$("#go").disabled=true;$("#go").textContent="Đang tạo…";
try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(j.error||"Lỗi kết nối");
try{localStorage.setItem("vby-auth",JSON.stringify({auth:j.auth,name:j.name}))}catch(x){}
$("#go").textContent="✓ Đã tạo! Đang chuyển…";setTimeout(()=>location.href="/admin",600)}
catch(x){er.textContent=x.message;$("#go").disabled=false;$("#go").textContent="Tạo tài khoản →"}};
</script>
</body>
</html>
